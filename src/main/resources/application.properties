spring.application.name=rokolaBackend

# Lee las credenciales desde el archivo .env de la raiz (no se sube a git).
spring.config.import=optional:file:.env[.properties]

# --- Conexion a PostgreSQL ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
# Flyway es el unico responsable del esquema: Hibernate no crea ni modifica tablas.
# "validate" solo comprueba al arrancar que cada entidad coincide con las tablas reales.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway ---
# Si la base ya tiene las tablas (restauradas del backup) pero no tiene historial,
# Flyway la marca como version 1 sin ejecutar V1. En una base vacia, ejecuta V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# --- API REST ---
# Errores en formato Problem Details (RFC 9457): application/problem+json.
spring.mvc.problemdetails.enabled=true
# Listas paginadas con un formato JSON estable: { "content": [...], "page": {...} }.
spring.data.web.pageable.serialization-mode=via-dto
spring.data.web.pageable.max-page-size=100

# --- Actuator (solo para desarrollo local) ---
management.endpoints.web.exposure.include=health,flyway
management.endpoint.health.show-details=always
